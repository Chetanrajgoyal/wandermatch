<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your personalized travel dashboard — Kibi">
  <title>Dashboard — Kibi</title>
  <script src="js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="font-sans bg-cream text-text-main antialiased">
  <div id="navContainer"></div>

  <main class="page">
    <div class="container">
      <!-- Greeting -->
      <section id="dashGreeting" class="page-header max-w-3xl">
        <h1 class="heading-2 font-serif text-charcoal">Good afternoon</h1>
        <p class="text-large text-text-secondary">Ready for your next adventure?</p>
      </section>

      <!-- Quick Actions -->
      <section class="flex flex-wrap gap-4 mb-10" aria-label="Quick actions">
        <a href="plan-trip.html" class="btn btn-accent btn-lg shadow-soft hover:shadow-card transition-shadow">
          <span>✈️</span> Plan a Trip
        </a>
        <a href="discover.html" class="btn btn-secondary btn-lg shadow-soft hover:shadow-card transition-shadow">
          <span>🧭</span> Discover
        </a>
        <a href="my-trips.html" class="btn btn-secondary btn-lg shadow-soft hover:shadow-card transition-shadow">
          <span>📋</span> My Trips
        </a>
        <a href="profile.html" class="btn btn-ghost btn-lg">
          <span>👤</span> Profile
        </a>
      </section>

      <!-- Stats -->
      <section id="dashStats" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-16"></section>

      <!-- Upcoming Trips -->
      <section class="mb-16">
        <div class="flex items-center justify-between mb-6">
          <h2 class="heading-3 font-serif text-charcoal">Upcoming Trips</h2>
          <a href="my-trips.html" class="btn btn-ghost btn-sm">View all →</a>
        </div>
        <div id="upcomingTrips" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
      </section>

      <!-- Recommended Trips -->
      <section class="mb-16">
        <div class="flex items-center justify-between mb-6">
          <h2 class="heading-3 font-serif text-charcoal">Recommended for You</h2>
          <a href="discover.html" class="btn btn-ghost btn-sm">Explore more →</a>
        </div>
        <div id="recommendedTrips" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6"></div>
      </section>

      <!-- Compatible Travelers -->
      <section class="mb-16">
        <div class="flex items-center justify-between mb-6">
          <h2 class="heading-3 font-serif text-charcoal">Compatible Travelers</h2>
        </div>
        <div id="compatibleTravelers" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
      </section>
    </div>
  </main>

  <div id="footerContainer"></div>

  <!-- API Layer -->
  <script src="js/api/api-config.js"></script>
  <script src="js/api/api-cache.js"></script>
  <script src="js/api/geocoding-api.js"></script>
  <script src="js/api/weather-api.js"></script>
  <script src="js/api/places-api.js"></script>
  <script src="js/api/routing-api.js"></script>

  <script src="js/storage.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/app.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
