<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Kibi account — personalized travel planning starts here.">
  <title>Sign Up — Kibi</title>
  <script src="js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-cream text-text-main font-sans antialiased">
  <div id="navContainer"></div>

  <div class="split-layout min-h-screen flex">
    <div class="split-image relative w-0 md:w-5/12 lg:w-[45%] hidden md:block">
      <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200&q=80" alt="Backpacker at mountain ridge" loading="eager" class="w-full h-full object-cover">
      <div class="split-image-overlay absolute inset-0 flex flex-col justify-end p-12 bg-gradient-to-t from-charcoal/80 via-charcoal/30 to-transparent text-white">
        <h2 class="font-serif text-3xl md:text-4xl mb-2">Start your journey.</h2>
        <p class="text-lg opacity-80">Create your travel profile and find your people.</p>
      </div>
    </div>

    <div class="split-content flex-1 flex items-center justify-center p-6 md:p-12 bg-cream">
      <div class="split-form w-full max-w-md page-enter">
        <div class="bg-white rounded-2xl shadow-soft p-8 md:p-10">
          <a href="index.html" class="nav-logo mb-8 inline-flex items-center gap-2 text-text-main">
            <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-7 h-7">
              <path d="M14 2L4 10V26H24V10L14 2Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <path d="M14 2L8 26M14 2L20 26" stroke="#5B7B6A" stroke-width="1.5"/>
              <circle cx="14" cy="10" r="3" fill="#5B7B6A"/>
            </svg>
            <span class="font-serif text-xl tracking-tight">Kibi</span>
          </a>

          <h1 class="heading-2 mb-2 text-text-main">Create your account</h1>
          <p class="text-large mb-8">Tell us a bit about yourself to get started.</p>

          <form id="signupForm">
            <div class="form-group">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" id="name" class="form-input" placeholder="Your name" autocomplete="name">
            </div>
            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="form-group">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" class="form-input" placeholder="Create a password" autocomplete="new-password">
            </div>
            <div class="form-group">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm your password" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-full mb-6">Create Account</button>
          </form>

          <p class="text-center text-small mt-6">
            Already have an account? <a href="login.html" class="text-sage font-semibold hover:text-sage-dark transition-colors">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <div id="footerContainer"></div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
